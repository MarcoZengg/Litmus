[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-litmus"
version = "0.0.1"
description = "Evaluate LLM and RAG apps, and tell real changes from noise."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jmespath>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
litmus = "litmus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/litmus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
